<text x="400" y="624" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#5a3a1c">Ámbar</text>
<text x="400" y="648" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" fill="#5a3a1c">07</text>
<rect x="318" y="468" width="14" height="266" rx="7" fill="#ffffff" opacity=".5"/>
<rect x="474" y="478" width="6" height="240" rx="3" fill="#ffffff" opacity=".45"/>
